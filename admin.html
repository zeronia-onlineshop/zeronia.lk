<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeronia Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f8;color:#10264a}
header{background:#082650;color:white;padding:22px}
header h1{margin:0;color:#edbd45}
header p{margin:7px 0 0}
main{max-width:1000px;margin:25px auto;padding:0 15px}
.panel{background:white;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 3px 15px #0000000b}
h2{margin-top:0}
input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd2dc;border-radius:7px;font-size:15px}
label{font-weight:bold;font-size:14px}
button{border:0;border-radius:7px;padding:11px 15px;cursor:pointer;font-weight:bold}
.save{background:#082650;color:white;width:100%}
.delete{background:#ffe5e5;color:#a00}
.edit{background:#f5d16b;color:#10264a}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{border:1px solid #ddd;border-radius:10px;padding:12px;overflow:hidden}
.card img{width:100%;height:160px;object-fit:cover;border-radius:7px}
.status{font-size:13px;font-weight:bold;color:#168447}
.out{color:#bd3030}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#message{font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>ZERONIA</h1>
<p>Gift & Accessories — Admin Dashboard</p>
</header>

<main>
<section class="panel" id="loginPanel">
<h2>Admin Login</h2>
<label>Email</label>
<input id="email" type="email" placeholder="Admin email" required>
<label>Password</label>
<input id="password" type="password" placeholder="Password" required>
<button class="save" id="loginButton">Login</button>
<p id="loginMessage"></p>
</section>

<div id="adminArea" class="hidden">
<section class="panel">
<button id="logoutButton" class="delete">Logout</button>
<h2 id="formTitle">Add New Product</h2>
<form id="productForm">
<input type="hidden" id="productId">

<label>Product Name</label>
<input id="name" required placeholder="e.g. Teddy Bear">

<label>Category</label>
<select id="category" required>
  <option value="Gifts & Accessories">Gifts & Accessories</option>
  <option value="Flower Bouquets">Flower Bouquets</option>
  <option value="Home Decor Items">Home Decor Items</option>
  <option value="Soft Toys">Soft Toys</option>
  <option value="Other Items">Other Items</option>
</select>

<label>Product Description</label>
<textarea id="description" rows="4" placeholder="Enter product details, features and benefits"></textarea>

<label>Price (LKR)</label>
<input id="price" type="number" min="0" step="1" required placeholder="2500">

<label>Product Photo</label>
<input id="photo" type="file" accept="image/*">
<small>Select a photo from your computer. Maximum 5 MB.</small>

<label>Stock Status</label>
<select id="status">
<option value="Available">Available</option>
<option value="Out of Stock">Out of Stock</option>
</select>

<div class="actions">
<button class="save" type="submit" id="saveButton">Save Product</button>
<button type="button" id="cancelButton" hidden>Cancel Edit</button>
</div>
<p id="message"></p>
</form>
</section>

<section class="panel">
<h2>Manage Products</h2>
<p id="count">Products: 0</p>
<div class="products" id="products"></div>
</section>
</div>
</main>

<script>
const SUPABASE_URL = "https://fjyqntkkiyxghvlmdhnm.supabase.co";
const SUPABASE_KEY = "sb_publishable_5J6jGrNT5RZ1RQEBw883Fw_ehEFqP7H";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let items = [];
let selectedFile = null;
let oldImage = "";
const $ = id => document.getElementById(id);

function showMessage(message, isError=false) {
  $("message").textContent = message;
  $("message").style.color = isError ? "#bd3030" : "#168447";
}

async function checkSession() {
  const {data, error} = await db.auth.getSession();
  if (error) {
    $("loginMessage").textContent = error.message;
    return;
  }
  if (data.session) {
    $("loginPanel").classList.add("hidden");
    $("adminArea").classList.remove("hidden");
    await loadItems();
  } else {
    $("loginPanel").classList.remove("hidden");
    $("adminArea").classList.add("hidden");
  }
}

$("loginButton").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) {
    $("loginMessage").textContent = "Enter email and password.";
    return;
  }

  $("loginButton").disabled = true;
  $("loginMessage").textContent = "Logging in...";

  const {error} = await db.auth.signInWithPassword({email, password});

  $("loginButton").disabled = false;

  if (error) {
    $("loginMessage").textContent = error.message;
    return;
  }
  $("loginMessage").textContent = "";
  await checkSession();
});

$("logoutButton").addEventListener("click", async () => {
  await db.auth.signOut();
  items = [];
  render();
  await checkSession();
});

$("photo").addEventListener("change", function() {
  selectedFile = this.files[0] || null;
  if (!selectedFile) return;

  if (!selectedFile.type.startsWith("image/")) {
    alert("Please select an image.");
    this.value = "";
    selectedFile = null;
    return;
  }

  if (selectedFile.size > 5000000) {
    alert("Please choose an image under 5 MB.");
    this.value = "";
    selectedFile = null;
  }
});

async function uploadPhoto(file) {
  const extension = file.name.split(".").pop().toLowerCase();
  const path = `${Date.now()}-${crypto.randomUUID()}.${extension}`;

  const {error} = await db.storage
    .from("product-images")
    .upload(path, file, {upsert:false});

  if (error) throw error;

  const {data} = db.storage
    .from("product-images")
    .getPublicUrl(path);

  return data.publicUrl;
}

async function loadItems() {
  $("products").textContent = "Loading products...";

  const {data, error} = await db
    .from("products")
    .select("*")
    .order("created_at", {ascending:false});

  if (error) {
    $("products").textContent = "Could not load products: " + error.message;
    return;
  }

  items = data || [];
  render();
}

function resetForm() {
  $("productForm").reset();
  $("productId").value = "";
  selectedFile = null;
  oldImage = "";
  $("formTitle").textContent = "Add New Product";
  $("saveButton").textContent = "Save Product";
  $("cancelButton").hidden = true;
  showMessage("");
}

$("productForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const id = $("productId").value;
  const old = items.find(p => String(p.id) === id);

  const product = {
    name: $("name").value.trim(),
    description: $("description").value.trim(),
    category: $("category").value,
    price: Number($("price").value),
    status: $("status").value,
    image_url: oldImage || (old ? old.image_url || "" : "")
  };

  if (!product.name || !Number.isFinite(product.price) || product.price < 0) {
    alert("Please check the product name and price.");
    return;
  }

  $("saveButton").disabled = true;
  showMessage("Saving product...");

  try {
    if (selectedFile) {
      product.image_url = await uploadPhoto(selectedFile);
    }

    let result;

    if (id) {
      result = await db.from("products").update(product).eq("id", id);
    } else {
      result = await db.from("products").insert(product);
    }

    if (result.error) throw result.error;

    resetForm();
    showMessage("Product saved successfully.");
    await loadItems();

  } catch (error) {
    showMessage("Error: " + error.message, true);
  } finally {
    $("saveButton").disabled = false;
  }
});

  function normalizeAdminCategory(value) {
  const text = String(value || "").toLowerCase().trim();

  if (text.includes("bouquet") || text.includes("flower")) {
    return "Flower Bouquets";
  }

  if (text.includes("home") || text.includes("decor")) {
    return "Home Decor Items";
  }

  if (
    text.includes("soft") ||
    text.includes("plush") ||
    text.includes("teddy") ||
    text.includes("toy")
  ) {
    return "Soft Toys";
  }

  if (text.includes("other")) {
    return "Other Items";
  }

  if (text.includes("gift") || text.includes("accessor")) {
    return "Gifts & Accessories";
  }

  return "Other Items";
}
  
function editProduct(id) {
  const p = items.find(item => String(item.id) === String(id));
  if (!p) return;

  $("productId").value = p.id;
  $("name").value = p.name;
  $("description").value = p.description || "";
  $("category").value = normalizeAdminCategory(p.category);
  $("price").value = p.price;
  $("status").value = p.status;
  $("photo").value = "";
  selectedFile = null;
  oldImage = p.image_url || "";

  $("formTitle").textContent = "Edit Product";
  $("saveButton").textContent = "Update Product";
  $("cancelButton").hidden = false;
  window.scrollTo({top:0, behavior:"smooth"});
}

async function deleteProduct(id) {
  const p = items.find(item => String(item.id) === String(id));
  if (!p || !confirm("Delete " + p.name + "?")) return;

  const {error} = await db.from("products").delete().eq("id", id);

  if (error) {
    alert("Delete failed: " + error.message);
    return;
  }

  await loadItems();
}

$("cancelButton").addEventListener("click", resetForm);

function render() {
  $("count").textContent = "Products: " + items.length;
  $("products").replaceChildren();

  items.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";

    const photo = p.image_url || p.photo || "";
    if (photo) {
      const img = document.createElement("img");
      img.src = photo;
      img.alt = p.name;
      card.appendChild(img);
    }

    const title = document.createElement("h3");
    title.textContent = p.name;
    card.appendChild(title);

    const category = document.createElement("p");
    category.textContent = normalizeAdminCategory(p.category);
    card.appendChild(category);

    const price = document.createElement("p");
    price.textContent = "Rs. " + Number(p.price).toLocaleString("en-US");
    card.appendChild(price);

    const status = document.createElement("p");
    status.className = p.status === "Available" ? "status" : "status out";
    status.textContent = p.status;
    card.appendChild(status);

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.className = "edit";
    edit.textContent = "Edit";
    edit.addEventListener("click", () => editProduct(p.id));

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "Delete";
    del.addEventListener("click", () => deleteProduct(p.id));

    actions.append(edit, del);
    card.appendChild(actions);
    $("products").appendChild(card);
  });
}

db.auth.onAuthStateChange(() => {
  setTimeout(checkSession, 0);
});

checkSession();
</script>
</body>
</html>
